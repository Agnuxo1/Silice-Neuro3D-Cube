[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silice-neuro3d-cube"
version = "0.1.0"
description = "Reproducible research models for laser-written optical silica networks"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
