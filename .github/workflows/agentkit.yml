name: Agent kit tests

# Runs the closure kit (agentkit/, guide v2 of 2026-10-12) on Windows and
# Linux with its own hash-locked environment. Kept separate from the CPU
# suite so tests/ and scripts/check.py (Codex-owned) are unchanged.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit:
    name: Kit v1 and v2 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            lock: requirements/agentkit-linux-py313.lock
          - os: windows-2022
            lock: requirements/agentkit-win-py313.lock
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up CPython 3.13.7
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.7"

      - name: Install pinned kit dependencies (hash-checked)
        run: python -m pip install --require-hashes -r "${{ matrix.lock }}"

      - name: Verify the kit matches the guide byte for byte
        run: python -B tools/verify_agentkit_guide.py

      - name: Run kit v1 tests (32)
        run: python -B -m unittest agentkit.test_v1 -v

      - name: Run kit v2 tests (29)
        run: python -B -m unittest agentkit.test_v2 -v
