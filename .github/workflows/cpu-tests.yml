name: CPU tests

# Runs the CPU-only suite on Windows (the original target) and Linux
# (second platform for reproduction). No GPU, Blender or secrets are used.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-suite:
    name: CPU suite on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            lock: requirements/cpu-linux-py313.lock
          - os: windows-2022
            lock: requirements/cpu-win-py313.lock
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up CPython 3.13.7
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.7"

      - name: Install pinned dependencies (hash-checked)
        run: python -m pip install --require-hashes -r "${{ matrix.lock }}"

      - name: Run the CPU suite
        run: python -B scripts/check.py

      - name: Run the vectorial validation gates (V1-V5)
        run: python -B -m unittest discover -s experimentos/vectorial_claude -p "test_*.py"

  repo-size-guard:
    name: Fail on new blobs above 10 MB
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare the pushed range with its base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/repo_size_guard.py --base "$BASE_SHA" --head HEAD --limit-mb 10
